<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1917">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/app.css?v=5">
<title>Masuk · Sin Coffee</title>
</head>
<body>
<main class="login">
  <div class="brand" style="justify-content:center"><span class="logo" style="background:var(--ink);color:var(--app)"><img src="assets/logo-sin.jpg" alt="Sin Coffee" width="36" height="36" style="width:36px;height:36px"></span><div><b>Sin Coffee</b><small class="hint">Masuk dengan PIN</small></div></div>
  <div class="seg" role="group" aria-label="Masuk sebagai">
    <button type="button" data-p="barista" aria-pressed="false">Barista</button>
    <button type="button" data-p="owner" aria-pressed="false">Owner</button>
  </div>
  <div class="pindots" aria-live="polite" id="dots"></div>
  <div class="banner b-err" id="err" hidden></div>
  <div class="pinpad">
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
    <button type="button" data-k="del" aria-label="Hapus">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" id="ok" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Masuk</button>
  </div>
</main>
<script src="assets/config.js"></script>
<script src="assets/sb.js?v=3"></script>
<script>
(function () {
  var ke = (new URLSearchParams(location.search).get('ke') || '').replace(/[^a-z.]/g, '');
  var izin = ['barista.html', 'ringkasan.html', 'qr.html'];
  var peran = ke === 'barista.html' ? 'barista' : 'owner', pin = '', busy = false;
  var dots = document.getElementById('dots'), err = document.getElementById('err');
  function seg() { document.querySelectorAll('[data-p]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.p === peran)); }); }
  function draw() { var h = ''; for (var i = 0; i < Math.max(4, pin.length); i++) h += '<span class="' + (i < pin.length ? 'f' : '') + '"></span>'; dots.innerHTML = h; }
  document.querySelectorAll('[data-p]').forEach(function (b) { b.addEventListener('click', function () { peran = b.dataset.p; seg(); }); });
  async function go() {
    if (busy || !pin) return; busy = true; err.hidden = true; document.getElementById('ok').textContent = '…';
    try {
      var d = await SB.rpc('sc_login', { p_peran: peran, p_pin: pin });
      try { localStorage.setItem('sc_sesi', d.token); } catch (e) {}
      location.href = peran === 'barista' ? 'barista.html' : (izin.indexOf(ke) >= 0 ? ke : 'ringkasan.html');
    } catch (e) { err.textContent = e.message; err.hidden = false; pin = ''; draw(); }
    busy = false; document.getElementById('ok').textContent = 'Masuk';
  }
  document.querySelectorAll('[data-k]').forEach(function (b) { b.addEventListener('click', function () {
    var k = b.dataset.k; if (k === 'del') pin = pin.slice(0, -1); else if (k === 'ok') return go(); else if (pin.length < 8) pin += k; draw(); }); });
  document.addEventListener('keydown', function (e) { if (/^\d$/.test(e.key) && pin.length < 8) pin += e.key; else if (e.key === 'Backspace') pin = pin.slice(0, -1); else if (e.key === 'Enter') return go(); draw(); });
  if (!SB.siap) { err.textContent = 'Aplikasi belum diatur: isi url dan anonKey Supabase di assets/config.js.'; err.hidden = false; }
  seg(); draw();
})();
</script>
</body>
</html>
